<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Saved Sessions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --border-hover: #d1d5db;
      --text-main: #111827;
      --text-muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text-main);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 32px;
      color: var(--text-main);
    }

    #sessions-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* Cards */
    .session {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .session h2 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .btn:hover { background: #f3f4f6; color: var(--text-main); }
    
    .restore-btn { color: var(--accent); border-color: #bfdbfe; }
    .restore-btn:hover { background: #eff6ff; color: var(--accent-hover); border-color: #93c5fd; }
    
    .delete-session-btn { color: var(--danger); border-color: #fecaca; }
    .delete-session-btn:hover { background: #fef2f2; color: var(--danger-hover); border-color: #fca5a5; }

    /* Links List */
    .links-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 4px;
    }
    .link-row:hover {
      background: #f9fafb;
    }

    .link {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 88%;
    }
    .link:hover {
      text-decoration: underline;
    }

    .delete-link-btn {
      background: transparent;
      color: var(--border);
      border: none;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 4px;
      border-radius: 4px;
    }
    .link-row:hover .delete-link-btn {
      color: var(--text-muted);
    }
    .delete-link-btn:hover {
      color: var(--danger) !important;
      background: #fef2f2;
    }

    /* Add Link Form */
    .add-link-form {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    
    .add-link-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
    }
    .add-link-input:focus {
      border-color: var(--accent);
    }

    .add-link-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 0 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .add-link-btn:hover {
      background: #f9fafb;
      border-color: var(--border-hover);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
      padding: 40px;
      grid-column: 1 / -1;
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Saved Sessions</h1>
    <div id="sessions-container"></div>
  </div>
  <script src="session.js"></script>
</body>
</html>
