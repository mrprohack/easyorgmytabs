name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Syntax check production scripts
        run: |
          node --check background.js
          node --check logic.js
          node --check popup.js
          node --check session.js

      - name: Install Chromium E2E dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Run Chromium smart-regroup E2E
        run: node tests/e2e/regroup.e2e.js
