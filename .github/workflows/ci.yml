name: CI

on:
  push:
    branches:
      - master
      - feat/v1.2-reliability
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Syntax check production scripts
        run: |
          node --check background.js
          node --check logic.js
          node --check popup.js
          node --check session.js
