<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Easy Organize My Tabs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell" aria-labelledby="app-title">
    <header class="topbar">
      <div>
        <p class="eyebrow">TAB WORKSPACE</p>
        <h1 id="app-title">Easy Organize</h1>
      </div>
      <button id="open-options" class="icon-button" type="button" aria-label="Open settings" title="Settings">⚙</button>
    </header>

    <section class="stats" aria-label="Tab summary">
      <div class="stat"><strong id="total-count">0</strong><span>Open</span></div>
      <div class="stat"><strong id="duplicate-count">0</strong><span>Duplicates</span></div>
      <div class="stat"><strong id="selected-count">0</strong><span>Selected</span></div>
    </section>

    <section class="search-panel" aria-label="Find and arrange tabs">
      <label class="search-box" for="search-input">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" autocomplete="off" placeholder="Search title, URL, or domain">
      </label>
      <div class="select-row">
        <label>Group
          <select id="group-select">
            <option value="window">Window</option>
            <option value="domain">Domain</option>
            <option value="none">None</option>
          </select>
        </label>
        <label>Sort
          <select id="sort-select">
            <option value="position">Position</option>
            <option value="title">Title</option>
            <option value="domain">Domain</option>
          </select>
        </label>
      </div>
    </section>

    <section class="action-panel" aria-label="Tab actions">
      <div class="action-row">
        <button id="select-visible" class="secondary-button" type="button">Select visible</button>
        <button id="clear-selection" class="secondary-button" type="button">Clear</button>
        <button id="close-duplicates" class="secondary-button accent" type="button">Clean duplicates</button>
      </div>
      <div id="bulk-actions" class="action-row bulk-actions" aria-label="Actions for selected tabs">
        <button type="button" data-bulk-action="reload">Reload</button>
        <button type="button" data-bulk-action="pin">Pin</button>
        <button type="button" data-bulk-action="mute">Mute</button>
        <button type="button" data-bulk-action="close" class="danger">Close</button>
      </div>
    </section>

    <section id="tab-groups" class="tab-groups" aria-label="Open tabs"></section>

    <section id="empty-state" class="empty-state" hidden>
      <div aria-hidden="true">◎</div>
      <h2>No matching tabs</h2>
      <p>Change the search or open a new browser tab.</p>
    </section>

    <footer class="footer-actions">
      <button id="save-window" class="primary-button" type="button">Save this window</button>
      <button id="save-all" class="secondary-button" type="button">Save all windows</button>
    </footer>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
